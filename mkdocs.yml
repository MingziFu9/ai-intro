# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: 人工智能导论
site_description: 面向成人教育人工智能技术应用专业（专科）的《人工智能导论》教材，每章配套免安装的在线体验和交互动画
site_url: https://mingzifu9.github.io/ai-intro/
repo_url: https://github.com/MingziFu9/ai-intro
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 人工智能概述": chapters/01-overview/index.md
  - "第 2 章 搜索、知识表示与专家系统": chapters/02-search-knowledge/index.md
  - "第 3 章 机器学习入门": chapters/03-machine-learning/index.md
  - "第 4 章 深度学习入门": chapters/04-deep-learning/index.md
  - "第 5 章 自然语言处理与大模型": chapters/05-nlp-llm/index.md
  - "第 6 章 计算机视觉": chapters/06-computer-vision/index.md
  - "第 7 章 语音技术": chapters/07-speech/index.md
  - "第 8 章 强化学习、生成式 AI 与智能体": chapters/08-rl-agents/index.md
  - "第 9 章 行业应用、伦理与法规": chapters/09-applications-ethics/index.md
  - 交互动画:
    - sims/index.md
    - "曲线拟合与过拟合": sims/curve-fitting/index.md
    - "K 近邻与 K 均值": sims/knn-kmeans/index.md
    - "阈值与混淆矩阵": sims/threshold-confusion/index.md
  - 学习图谱: learning-graph/index.md
  - 常见问题: faq/index.md
  - "在线模拟卷": exam/index.md
  - 附录:
    - "附录 A 在线平台与账号指南": appendix/a-platforms.md
    - "附录 B 人工智能大事年表": appendix/b-timeline.md
    - "附录 C 专业课程地图": appendix/c-course-map.md
    - "附录 D 术语表": appendix/glossary.md
