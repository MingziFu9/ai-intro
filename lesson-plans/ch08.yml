# 第 8 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 8
online: 2
offline: 2
methods:
- 讲授法
- 案例教学法（仓库运维小何贯穿案例）
- 演示法（交互动画）
- 项目教学法（低代码平台搭建智能体）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出强化学习的六个基本要素（智能体、环境、状态、动作、奖励、策略），以及 AI 智能体的四个组成部分（大模型、规划、工具、记忆）
  - 解释强化学习和监督学习的区别、探索与利用的含义，以及 AlphaGo 怎样把搜索、深度学习和强化学习结合起来
  - 用自己的话说明智能体“思考、行动、观察”的工作过程，工具调用和模型上下文协议（MCP）的作用
  skill:
  - 手算一段奖励的折扣回报和一次 Q 值的更新
  - 用扣子或 Dify 等低代码平台，搭建一个带知识库和插件的简单智能体
  - 分析一个强化学习或智能体应用中奖励设计、权限控制的风险，提出需要人确认的环节
  quality:
  - 理解“你奖励什么，它就学什么”，设计和使用 AI 系统时考虑可能的意外后果
  - 使用智能体时坚持关键操作由人确认，只给必要的权限，不把个人信息和内部资料放进知识库
key_points:
- 强化学习的六个基本要素，与监督学习的区别
- Q 学习、探索与利用、奖励设计
- AlphaGo 与 AlphaZero，生成式人工智能全景
- AI 智能体的组成，思考、行动、观察，工具调用与 MCP，低代码平台
difficulties:
- point: Q 值怎样更新，“好消息”怎样从宝藏往回传
  solution: 先手算一次 Q 值更新（结果 2.2），再在“Q 学习格子世界”动画中一步一步走，看宝藏旁边的格子先变绿，再一格格往回传
- point: 把智能体的人设、知识库、插件配置好并测试
  solution: 线下课上按“创建—写人设—加知识库—加插件—测试—发布”六步带做，每一步投屏示范；准备一组测试问题，特别是知识库里没有的问题，检查它会不会编造
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 40
    content: 阅读网页教材第 8 章 8.1–8.8 节，完成正文中的 2 个“算一算”，观看课件；注册扣子或 Dify 账号，准备 2～3 份课程资料
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 8-1
    minutes: 20
    content: 交互动画“Q 学习格子世界”：调探索率、学习率、奖励，观察学习过程
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 为课堂上讲 Q 学习准备第一手观察
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 仓库运维小何：上百台搬运机器人自己找路，客服智能体自己查订单、算退款
    teacher: 讲述情景，提出“会试错的 AI”和“会办事的 AI”两个问题
    student: 说一说身边会“自己做决定”的 AI
    intent: 引出本章两条主线
  - name: 讲授与演示
    minutes: 15
    content: 8.1–8.2：强化学习的六要素，折扣回报，Q 值与 Q 学习，探索与利用，奖励设计
    teacher: 带学生手算折扣回报和一次 Q 值更新，用“Q 学习格子世界”动画演示
    student: 跟着计算，调动画参数回答问题
    intent: 突破难点一
  - name: 讲授
    minutes: 8
    content: 8.3–8.4：AlphaGo、AlphaGo Zero 与 AlphaZero，强化学习的其他应用，生成式人工智能全景
    teacher: 用时间线讲 AlphaGo 的三个版本，用全景表梳理文本、图像、语音、视频生成
    student: 说出 AlphaGo 结合了哪几种技术
    intent: 把前面各章串起来
  - name: 讲授与演示
    minutes: 10
    content: 8.5：AI 智能体的四个组成部分，思考、行动、观察，工具调用与 MCP，多智能体，智能体的风险
    teacher: 用“智能体工作过程回放”动画演示一个退货请求的处理过程
    student: 说出每一步是思考、行动还是观察
    intent: 理解智能体怎样“会做”
  - name: 在线体验 8-2（线下）
    minutes: 35
    content: 8.6：低代码智能体平台；用扣子或 Dify 搭一个“课程助教”智能体
    teacher: 投屏示范六个步骤，巡回指导，收集学生遇到的问题
    student: 按步骤搭建、测试并发布智能体，填写记录表
    intent: 突破难点二，做出一个能用的智能体
  - name: 拓展
    minutes: 5
    content: 8.7–8.8：具身智能与人形机器人半程马拉松，AI 编程助手、AI 搜索、帮你办事的智能体
    teacher: 展示案例，讨论智能体越能干越要管
    student: 说出一个需要人确认的环节
    intent: 开阔视野，树立安全意识
  - name: 课堂练习
    minutes: 9
    content: 课件中的 3 道课堂练习；展示两三个学生搭建的智能体
    teacher: 组织扫码作答并讲评，点评学生作品
    student: 在线作答，展示作品
    intent: 检验重点，交流经验
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点；介绍《机器学习》第 12 章和选修课“智能体开发”；预告第 9 章
    teacher: 带领学生梳理知识导图，布置课后作业
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 8-1、8-2 记录表，提交智能体的链接或截图
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：以“训练小狗学会坐下”为例，说明强化学习的六个基本要素分别是什么，并说明强化学习和监督学习的主要区别。
- 简答题：什么是探索与利用？用一个生活中的例子说明，并解释为什么 Q 学习中常用“大部分时候利用、偶尔探索”的办法。
- 简答题：某公司要做一个帮员工报销差旅费的 AI 智能体。请设计：（1）它需要哪些工具；（2）它处理一次报销的大致步骤（思考、行动、观察）；（3）哪些操作必须由人确认，为什么。
- 实操题：完成体验 8-1，提交记录表和两张截图（训练 200 回合后的格子地图、每回合步数的柱状图）。回答：训练后机器人走到宝藏用了几步？探索率 ε = 0 和 0.8 时学习效果有什么不同？“悬崖边”地图上它学会了走哪条路？
- 实操题：完成体验 8-2，提交智能体的人设、知识库文件清单、插件名称、10 个测试问题的记录表和发布链接（或截图）。回答：改进前后分别答对了几个问题？你做了哪些改进？教材里没有答案的问题，它是怎样回答的？
- 提交体验 8-1、体验 8-2 的记录表
assessment: 课堂练习正确率、智能体作品、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；强化学习的要素、Q 值更新的计算、智能体的组成是期末闭卷考试的常考内容
reflection: ''
