# 第 5 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 5
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法（客服组长小林贯穿案例）
- 演示法（交互动画）
- 任务驱动法（提示词改写、幻觉核查）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出自然语言处理的主要任务，以及中文处理特有的难点
  - 解释词向量“意思相近的词距离更近”的含义，语言模型怎样一个词一个词地生成文字，Token、上下文长度和温度分别是什么
  - 用自己的话说明注意力机制和 Transformer 的直观含义，大模型经过预训练、指令微调、人类反馈强化学习三个阶段“炼成”的过程
  skill:
  - 手算两个词向量的余弦相似度，估算一次大模型调用要消耗多少 Token、花多少钱
  - 按角色、任务、背景、格式、示例五要素写出结构清楚的提示词，并对大模型的输出进行核查
  - 分析大模型产生幻觉的原因，判断一个场景是否需要检索增强生成或人工核查
  quality:
  - 养成核查 AI 输出的习惯，不转发、不使用未经核实的 AI 生成内容
  - 遵守《生成式人工智能服务管理暂行办法》，不向公共大模型输入个人信息和单位内部资料
key_points:
- 分词与中文处理的难点，词向量与余弦相似度
- 语言模型“预测下一个词”，Token、上下文长度与温度
- 注意力与 Transformer 的直观含义，预训练、指令微调、人类反馈强化学习
- 提示词五要素，幻觉、检索增强生成与核查
difficulties:
- point: 理解大模型“一个词一个词地按概率生成”，以及温度的作用
  solution: 先做“算一算：一个字一个字地写出一句话”，再用“温度与采样”动画把温度从 0 拖到 2，抽 20 次看结果的变化
- point: 理解幻觉为什么难以避免，以及怎样核查
  solution: 用小林遇到的“国家规定空调包修六年”案例，让学生现场用权威来源核查；对比开、关联网搜索的回答，引出检索增强生成
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 60
    content: 阅读网页教材第 5 章 5.1–5.8 节，完成正文中的 5 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 5-1
    minutes: 20
    content: 提示词工程练习：用五要素改写 3 条提示词，比较改写前后的输出
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 体会提示词对输出质量的影响
  - name: 在线体验 5-2
    minutes: 25
    content: 交互动画“温度与采样”，并核查大模型回答中的 3 个事实
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 理解生成方式，亲身体会幻觉
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 客服组长小林：大模型几分钟写好周报初稿，也编出了“空调包修六年”
    teacher: 讲述情景，展示学生在体验 5-2 中发现的幻觉
    student: 说一说自己用大模型踩过的坑
    intent: 用正反两面的经历引出本章
  - name: 讲授
    minutes: 5
    content: 5.1–5.2：自然语言处理的任务，中文的难点，分词，词向量与余弦相似度
    teacher: 用“研究生命的起源”演示分词歧义；用“词向量与余弦相似度”动画看意思相近的词
    student: 现场切分一句话，读出两个词的相似度
    intent: 建立“把词变成数字”的认识
  - name: 讲授与演示
    minutes: 7
    content: 5.3：语言模型、Token、上下文长度、温度；“算一算：客服中心一天要花多少钱”
    teacher: 用“温度与采样”动画演示，带学生估算 Token 成本
    student: 跟着计算，回答温度高低各适合什么任务
    intent: 突破难点一
  - name: 讲授与演示
    minutes: 7
    content: 5.4–5.5：注意力与 Transformer，BERT 与 GPT，预训练、指令微调、人类反馈强化学习，推理模型
    teacher: 用“自注意力热力图”动画演示“它”指谁；用三阶段比喻“读书、听指令、学分寸”
    student: 回答 GPT 和 BERT 的区别
    intent: 了解大模型的来历，不深究计算
  - name: 任务驱动
    minutes: 8
    content: 5.6：提示词五要素与技巧；现场改写一条提示词
    teacher: 展示小林改写提示词的案例，给出一个新任务让学生现场改写
    student: 用五要素改写提示词，对比输出
    intent: 把方法用到工作中
  - name: 讲授
    minutes: 6
    content: 5.7：幻觉、知识截止与偏见，检索增强生成，学会核查
    teacher: 组织学生核查一条大模型回答，对比联网和不联网的结果
    student: 现场核查并汇报
    intent: 突破难点二
  - name: 课堂练习
    minutes: 5
    content: 课件中的 3 道课堂练习，其余在线题课后完成
    teacher: 组织学生扫码作答，讲评错误率高的选项
    student: 在线作答，查看解析
    intent: 即时检验重点掌握情况
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点；介绍《自然语言处理导论》；预告第 6 章计算机视觉
    teacher: 带领学生梳理知识导图，布置课后作业
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 5-1、5-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用自己的话说明：语言模型只会“预测下一个词”，为什么能写出完整的文章，还能回答各种问题？
- 简答题：比较大模型训练的三个阶段：每个阶段用什么数据、学会了什么？各用一个生活中的比喻说明。
- 简答题：一家医院想做一个回答患者“挂号、检查、报销”问题的智能助手。请说明：（1）直接用通用大模型回答会有什么风险？（2）怎样用检索增强生成来改进？（3）还需要哪些人工把关的措施？
- 实操题：完成体验 5-1，提交两次提示词、两次输出和评分表。回答：五要素提示词的得分比一句话提示词高多少？一句话提示词的输出里，模型自己“编”了哪些信息？你认为五要素中哪个要素对结果影响最大，为什么？
- 实操题：完成体验 5-2，提交记录表。回答：温度从 0 升到 1.8，抽出的字有什么变化？三个问题中哪个幻觉最多？你核查的论文中有几篇是真实存在的？打开联网搜索后有什么变化？
- 提交体验 5-1、体验 5-2 的记录表
assessment: 课堂练习正确率、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；Token 与温度、提示词五要素、幻觉与检索增强生成是期末闭卷考试的重点
reflection: ''
