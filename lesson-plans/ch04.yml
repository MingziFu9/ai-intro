# 第 4 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 4
online: 4
offline: 0
methods:
- 讲授法（录播课件）
- 案例教学法（面单处理组小周贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上自主学习
objectives:
  knowledge:
  - 说出人工神经元的组成（输入、权重、偏置、激活函数、输出），区分深度学习、机器学习和人工智能的关系
  - 解释人工神经元怎样把输入加权求和再“激活”，说明感知机为什么学不会“异或”、多层网络为什么更强
  - 用自己的话说明训练在调什么：损失函数、梯度下降、反向传播、学习率和训练轮次各起什么作用
  - 说明卷积神经网络和循环神经网络各适合处理什么数据，深度学习在 2012 年以后爆发的三个原因
  skill:
  - 手算一个神经元的输出、一个两层小网络完成“异或”的过程，以及几步梯度下降
  - 列举主流深度学习框架（PyTorch、TensorFlow、飞桨、昇思）和 AI 芯片，分析一个身边的 AI 应用用到了哪种神经网络
  quality:
  - 认识深度学习对数据和算力的依赖，了解我国 AI 芯片和飞桨、昇思等国产框架自主创新的意义
  - 正确看待 AI 的错误率，在关键场景中坚持“AI 初筛、人工复核”
key_points:
- 人工神经元的组成：输入、权重、偏置、激活函数
- 感知机的局限与多层神经网络
- 损失函数、梯度下降、反向传播、学习率
- 卷积神经网络与循环神经网络适合的数据，深度学习爆发的三个原因
difficulties:
- point: 理解训练在调什么：梯度下降和反向传播
  solution: 用“蒙着眼睛下山”比喻梯度下降，在“梯度下降”动画中把学习率调大调小看步子；“算一算：几步梯度下降”手算三步；反向传播只讲“谁的错就改谁”，不推导
- point: 为什么多层网络能解决“异或”
  solution: 先在坐标纸上画出四个点，让学生试着用一条直线分开（做不到）；再做“算一算：两层网络完成异或”，看两条直线组合起来就分开了
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 75
    content: 阅读网页教材第 4 章 4.1–4.7 节，完成正文中的 4 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 4-1
    minutes: 30
    content: 交互动画“神经元与激活函数”“梯度下降”：调权重和偏置看输出，调学习率看下山过程
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 在操作中理解神经元的计算和训练的过程
  - name: 在线体验 4-2
    minutes: 25
    content: 交互动画“手写数字识别”：自己写数字让网络识别，观察它认错的情况
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 体会深度学习“从数据中自己学特征”，认识它会出错
- phase: 线上导学（直播或录播）
  steps:
  - name: 难点导学
    minutes: 20
    content: 梳理预习中的共性问题；精讲两个难点（梯度下降与反向传播、两层网络完成异或）；介绍国产框架和 AI 芯片；完成 3 道课堂练习
    teacher: 直播讲解或发布录播课件，在讨论区集中回答预习中的共性问题
    student: 观看直播或录播，扫码完成课件中的 3 道课堂练习
    intent: 本章没有线下学时，用一次短的直播或录播把难点讲透
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 4-1、4-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用“蒙着眼睛下山”的比喻，说明梯度下降是怎样工作的，并解释学习率太小和太大分别会出现什么情况。
- 简答题：小周要做一个识别快递面单手写电话号码的系统。请说明：（1）为什么用深度学习比用人来设计特征更合适？（2）他该选择全连接网络、卷积神经网络还是循环神经网络来认单个数字的图片？为什么？（3）系统上线后，怎样减少寄错包裹的风险？
- 简答题：简述深度学习框架的作用，并列举两个国外框架和两个国产框架。我国为什么要发展自己的深度学习框架？
- 实操题：完成体验 4-1，提交记录表。根据记录回答：（1）感知机学会“与”用了几轮？“异或”训练 30 轮后还错几个点？为什么？（2）学习率 0.1、0.6、1.9、2.2 时，小球分别是怎样走的？哪个学习率最合适？
- 实操题：完成体验 4-2，提交十个数字的识别记录和一张截图。回答：你写的十个数字认对了几个？认错的是哪几个，网络把它认成了什么？把一个数字写歪、写小后，把握有什么变化？结合第 3 章的“泛化能力”解释原因。
- 提交体验 4-1、体验 4-2 的记录表
assessment: 课后在线练习成绩、简答与实操作业、体验记录表计入平时成绩；神经元的计算、梯度下降的思路、两类网络适合的数据是期末闭卷考试的常考内容
