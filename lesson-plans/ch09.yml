# 第 9 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 9
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法（电商运营小宋贯穿案例）
- 演示法（交互动画）
- 讨论法（合规检查案例）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出人工智能在医疗、金融、交通、制造等行业的典型应用，以及我国规范人工智能的主要法律法规
  - 解释算法偏见、可解释性、信息茧房、深度伪造、提示词攻击的含义和产生原因
  - 说明人工智能对就业的影响，以及本专业学生可以从事的新岗位和需要的能力
  skill:
  - 运用《个人信息保护法》《生成式人工智能服务管理暂行办法》《人工智能生成合成内容标识办法》等规定，判断一个 AI 应用是否合规
  - 分析一个 AI 应用可能带来的伦理和安全风险，提出整改意见
  - 评价大模型的能耗问题，说出绿色算力的主要做法，形成负责任使用 AI 的意识
  quality:
  - 树立负责任使用 AI 的意识，遵守个人信息保护、生成式 AI 管理、内容标识等法律法规
  - 关注 AI 带来的公平、隐私、就业和能耗问题，主动适应 AI 时代的岗位变化，做“会用 AI 的人”
key_points:
- “人工智能+”行动与各行业的典型应用
- 人工智能对就业的影响与新岗位
- 算法偏见、可解释性、信息茧房、隐私保护
- 深度伪造、提示词攻击、对抗样本、数据泄露，我国和欧盟的人工智能法规
difficulties:
- point: 把各项法规对应到具体场景，判断一个 AI 应用是否合规
  solution: 用 9.5.1 节的法规表做“对号入座”，再拿小宋遇到的三件事（明星换脸带货、虚假宣传、老顾客加价）现场分析；体验 9-2 的合规检查表作为分析框架
- point: 理解算法偏见和信息茧房是怎样产生的
  solution: 用亚马逊简历筛选的案例说明“偏见来自历史数据”；用“信息茧房模拟”动画让学生亲手看到越点越推、越推越点的循环，再比较四种打破茧房的办法
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 60
    content: 阅读网页教材第 9 章 9.1–9.7 节，完成正文中的 2 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 9-1
    minutes: 20
    content: 交互动画“信息茧房模拟”：观察茧房形成，比较四种打破茧房的办法，检查自己常用应用的推荐设置
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 亲身体会推荐系统的反馈循环
  - name: 在线体验 9-2
    minutes: 25
    content: AI 生成内容合规检查：任选一个案例填写评估表，提出整改意见
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 学会用法规分析真实案例
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 电商运营小宋：AI 数字人主播、AI 写文案，也遇到明星换脸、虚假宣传、老顾客加价
    teacher: 讲述情景，请学生先凭直觉判断哪些能做、哪些不能做
    student: 举手表决并说理由
    intent: 带着问题学法规
  - name: 讲授
    minutes: 6
    content: 9.1–9.2：“人工智能+”行动，医疗、金融、交通、制造等行业应用，AI 对就业的影响与新岗位
    teacher: 用“算一算：预测性维护值不值”说明 AI 的价值；结合附录 C 讲岗位
    student: 说出自己行业里的一个 AI 应用
    intent: 联系学生的工作岗位
  - name: 讲授与演示
    minutes: 8
    content: 9.3：公平与算法偏见，透明与可解释性，信息茧房，隐私
    teacher: 讲亚马逊简历案例；用“信息茧房模拟”动画演示，讲评体验 9-1 的记录
    student: 说出茧房形成的过程和打破办法
    intent: 突破难点二
  - name: 讲授
    minutes: 6
    content: 9.4：深度伪造与诈骗，提示词攻击与对抗样本，数据泄露
    teacher: 讲香港 2 亿港元诈骗案，演示一条越狱提示词为什么会被拒绝
    student: 说出防范深度伪造诈骗的办法
    intent: 提高安全意识
  - name: 讨论
    minutes: 8
    content: 9.5：我国的人工智能法规，欧盟《人工智能法》，AI 生成内容的知识产权；回到小宋的三件事
    teacher: 用法规表对号入座，组织分组讨论小宋的三件事
    student: 分组用合规检查表分析并汇报
    intent: 突破难点一
  - name: 讲授
    minutes: 4
    content: 9.6–9.7：大模型的能耗与绿色算力，认出 AI 生成内容，管好自己的推荐，保护自己的脸和声音
    teacher: 用“算一算：训练一次 GPT-3 的电够多少户人家用”引出绿色算力
    student: 说出一种绿色算力的做法
    intent: 形成可持续发展的意识
  - name: 课堂练习
    minutes: 5
    content: 课件中的 3 道课堂练习，其余在线题课后完成
    teacher: 组织学生扫码作答，讲评错误率高的选项
    student: 在线作答，查看解析
    intent: 即时检验重点掌握情况
  - name: 全书总结
    minutes: 4
    content: 回顾全书九章的知识地图；介绍在线模拟卷和期末复习方法
    teacher: 用学习图谱和技术全景图串起全书，布置复习任务
    student: 说出全书印象最深的三个知识点
    intent: 形成全书的知识结构，为期末复习做准备
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 9-1、9-2 记录表；完成一套在线模拟卷
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：什么是信息茧房？推荐系统为什么会加剧信息茧房？请从平台和用户两个角度各提出两条打破信息茧房的办法。
- 简答题：某小区物业要求所有业主“刷脸进门”，不再提供门禁卡，并把业主的人脸照片存放在一台普通电脑里。请指出其中的问题、依据的规定，并提出整改意见。
- 简答题：人工智能会让很多人失业吗？结合本专业，谈谈你的看法，并说明你打算怎样提升自己的竞争力。
- 实操题：完成体验 9-1，提交记录表和你常用应用中推荐设置的截图（遮挡个人信息）。回答：信息茧房形成后，推荐覆盖了几类内容？四种打破茧房的办法中，哪种效果最明显？“迎合程度”对茧房的形成有什么影响？
- 实操题：完成体验 9-2，任选一个案例提交完整的评估表和整改意见。
- 提交体验 9-1、体验 9-2 的记录表
assessment: 课堂练习正确率、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；伦理与安全问题的识别、主要法规的适用场景是期末闭卷考试的重点，综合应用题常考合规分析
reflection: ''
