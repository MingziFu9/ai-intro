# 第 6 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 6
online: 4
offline: 0
methods:
- 讲授法（录播课件）
- 案例教学法（质检员小吴贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上自主学习
objectives:
  knowledge:
  - 说出像素、分辨率、灰度和 RGB 颜色的含义，以及计算机视觉的四类主要任务：图像分类、目标检测、图像分割和视频分析
  - 解释卷积核怎样在图上滑动、提取边缘等特征，卷积神经网络怎样逐层“看懂”图像
  - 说明人脸识别、文字识别、工业质检、医学影像的基本流程，以及使用人脸识别的法律要求
  skill:
  - 手算一个 3 × 3 窗口的卷积结果、一次最大池化，以及两个框的交并比
  - 用自己的话说明扩散模型生成图像的直观过程，写出结构清楚的文生图提示词，识别 AI 生成内容的标识
  - 分析一个视觉应用属于哪类任务，评价它可能出错的情况和需要的人工把关
  quality:
  - 尊重他人的肖像权和个人信息，了解《人脸识别技术应用安全管理办法》，不随意上传他人照片
  - 发布 AI 生成的图片时主动标识，不用 AI 制作虚假、误导性的图像
key_points:
- 像素、分辨率、灰度与 RGB
- 卷积核与特征提取，卷积神经网络
- 四类视觉任务与交并比
- 人脸识别、文字识别、工业质检，扩散模型与 AI 生成内容标识
difficulties:
- point: 卷积怎样计算，为什么能找出边缘
  solution: 先做“算一算：卷积核怎样找到边缘”手算一个 3 × 3 窗口；再在“卷积滤镜”动画中点击任意像素看计算过程，切换不同卷积核比较效果
- point: 目标检测怎样评价“框得准不准”
  solution: 用方格纸画两个框，数重叠和合并的格子算交并比；结合小吴的质检案例说明漏检和误检的代价
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 75
    content: 阅读网页教材第 6 章 6.1–6.7 节，完成正文中的 5 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 6-1
    minutes: 25
    content: 交互动画“卷积滤镜”：换卷积核看效果，点击像素看计算，上传自己的图片
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 在操作中理解卷积
  - name: 在线体验 6-2
    minutes: 30
    content: 用多模态大模型和 AI 绘画产品完成看图说话、文字识别和文生图，检查错误，找出 AI 生成标识
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 亲身体会视觉 AI 的能力和局限
- phase: 线上导学（直播或录播）
  steps:
  - name: 难点导学
    minutes: 20
    content: 梳理预习中的共性问题；精讲两个难点（卷积计算、交并比）；讲评学生在体验 6-2 中发现的识别错误；完成 3 道课堂练习
    teacher: 直播讲解或发布录播课件，在讨论区集中回答预习中的共性问题
    student: 观看直播或录播，扫码完成课件中的 3 道课堂练习
    intent: 本章没有线下学时，用一次短的直播或录播把难点讲透
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 6-1、6-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用自己的话说明卷积是怎样计算的，并解释为什么“竖直边缘”卷积核能找到图片中竖直的边。
- 简答题：比较图像分类、目标检测和图像分割三类任务：各回答什么问题、输出什么？请为每类任务各举一个工厂或生活中的例子。
- 简答题：某工厂每天生产 10 000 个零件，不良率 1%。AI 质检系统的召回率是 95%，并且会把 2% 的合格品误判为不良品。请计算：（1）系统每天漏掉几个不良品？（2）系统每天一共挑出多少个可疑零件交给人工复核？精确率是多少？（3）你认为这个系统值得使用吗？还需要什么措施？
- 实操题：完成体验 6-1，提交记录表和两张截图（“竖直边缘”处理“方块和圆”的结果、你自己设计的卷积核的结果）。回答：方块左边缘一格和方块内部一格的计算结果分别是多少？为什么相差这么大？你设计的卷积核产生了什么效果？
- 实操题：完成体验 6-2，提交记录表、你写的完整文生图提示词和生成的图片。回答：多模态大模型在看图说话和文字识别中出了哪些错？错字率是多少？你生成的图片有没有 AI 生成标识？画面中有没有不合理的地方？
- 提交体验 6-1、体验 6-2 的记录表
assessment: 课后在线练习成绩、简答与实操作业、体验记录表计入平时成绩；图像的表示、卷积、四类视觉任务、人脸识别的法律要求是期末闭卷考试的常考内容
