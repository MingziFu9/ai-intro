# 第 2 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法（售后调度员小陈贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出状态、动作、状态空间、搜索树的含义，能把一个简单问题表示成搜索问题
  - 解释广度优先、深度优先和启发式搜索的区别，说明 A* 搜索为什么既快又能找到最短路线
  - 说明产生式规则、语义网络、知识图谱三种知识表示方法，能把一句话写成三元组
  skill:
  - 手动执行一次广度优先搜索和 A* 搜索，并用极小极大方法为一棵小博弈树选出最好的一步
  - 用产生式规则完成一次专家系统的正向推理和反向推理，说出专家系统由哪几部分组成
  - 分析专家系统的局限，判断一个实际问题适合用规则、机器学习还是大模型来解决
  quality:
  - 体会“把实际问题抽象成状态、动作和目标”的计算思维，遇到问题先想清楚怎样表示
  - 尊重一线专家的经验，同时认识规则方法的局限，能根据问题选择规则、机器学习或大模型
key_points:
- 状态、动作、状态空间与组合爆炸
- 广度优先、深度优先与 A* 搜索的区别
- 极小极大与剪枝的思路
- 产生式规则、知识图谱三元组，专家系统的组成与正向、反向推理
difficulties:
- point: A* 搜索的“已走 + 还剩”怎样计算，启发函数起什么作用
  solution: 先做广度优先的“算一算”，再在同一张小地图上做 A* 的“算一算”，比较两者扩展的格子数；用“迷宫寻路”动画并排比较三种搜索
- point: 区分正向推理和反向推理
  solution: 用“动物识别专家系统”动画：先给事实看它一步步推出结论（正向），再先假设“是老虎”去找证据（反向）；对照医生“看症状下诊断”和“为验证某病开检查”
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 60
    content: 阅读网页教材第 2 章 2.1–2.7 节，完成正文中的 6 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 2-1
    minutes: 20
    content: 交互动画“迷宫寻路”：比较广度优先、深度优先、A* 三种搜索扩展的格子数和找到的路线
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 直观看到启发式搜索为什么更快
  - name: 在线体验 2-2
    minutes: 25
    content: 交互动画“动物识别专家系统”：用正向推理和反向推理识别动物，并补充一条规则
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 体会规则、事实和推理机怎样配合
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 售后调度员小陈的两件事：排路线（搜索）和帮客户排查故障（知识与推理）
    teacher: 讲述情景，提出本章的两条主线
    student: 说一说导航软件和客服知识库的使用经验
    intent: 把两条主线和工作场景挂钩
  - name: 讲授
    minutes: 8
    content: 2.1–2.2：状态、动作与目标，状态空间与组合爆炸，广度优先与深度优先
    teacher: 用小地图板书搜索树，带学生做“算一算：在小地图上做广度优先搜索”
    student: 跟着在纸上展开搜索树
    intent: 建立“把问题变成搜索”的思路
  - name: 讲授与演示
    minutes: 8
    content: 2.3：启发函数，贪婪搜索，A* 搜索，导航软件怎样规划路线
    teacher: 在同一张地图上做 A* 的“算一算”，用“迷宫寻路”动画对比三种搜索
    student: 计算每个格子的“已走 + 还剩”
    intent: 突破难点一
  - name: 讲授
    minutes: 6
    content: 2.4：博弈树、极小极大、剪枝，从“深蓝”到 AlphaGo
    teacher: 用一棵小博弈树演示极小极大，课堂上让学生下一局“井字棋”动画
    student: 为小博弈树选出最好的一步
    intent: 理解“假设对手也很聪明”
  - name: 讲授与演示
    minutes: 8
    content: 2.5–2.6：产生式规则、语义网络、知识图谱与三元组，专家系统的组成，正向与反向推理，MYCIN 与专家系统的局限
    teacher: 演示“动物识别专家系统”的两种推理方式
    student: 把一句话写成三元组，说出推理过程
    intent: 突破难点二
  - name: 课堂练习
    minutes: 8
    content: 课件中的 3 道课堂练习；“案例：怎样选择解决问题的方法”小组讨论
    teacher: 组织学生扫码作答，讲评；组织讨论规则、机器学习、大模型各适合什么问题
    student: 在线作答，分组讨论并汇报
    intent: 检验重点，学会选择方法
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点；介绍《自然语言处理导论》中的知识图谱；预告第 3 章机器学习
    teacher: 带领学生梳理知识导图，布置课后作业
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 2-1、2-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用自己的话比较广度优先搜索、深度优先搜索和 A* 搜索：它们分别按什么顺序展开状态？找到的路线一定最短吗？各举一个生活中的类比。
- 简答题：下面是一组家电故障排查规则：R1 如果 空调不制冷 并且 室外机不转，那么 怀疑电容或电源故障；R2 如果 怀疑电容或电源故障 并且 室外机有电，那么 是电容故障；R3 如果 是电容故障，那么 派师傅携带电容上门。已知：空调不制冷、室外机不转、室外机有电。请写出正向推理的过程和最终结论，并说明专家系统中哪一部分负责回答“为什么要带电容”。
- 简答题：某快递公司要做三件事：（1）根据公司规定，判断一个超重包裹要加收多少运费；（2）根据过去三年的数据，预测“双十一”每个网点每天要处理多少件包裹；（3）给一位快递员当天的 25 个派送地址排上门顺序。请判断每件事更适合用规则、机器学习还是搜索，并说明理由。
- 实操题：完成体验 2-1 第一部分：在“迷宫寻路”动画的迷宫 1 上分别运行广度优先、深度优先和 A*，提交三张运行结束后的截图和记录表。根据记录回答：哪种方法展开的格子最少？哪几种找到的路线最短？为什么深度优先在空地上找到的路线会弯弯绕绕？
- 实操题：完成体验 2-2：在“动物识别专家系统”动画中完成记录表的 4 行，并提交“为什么”按钮显示的一条推理链截图。在第 4 行中，写出你添加的规则，并说明它是否生效、为什么。
- 提交体验 2-1、体验 2-2 的记录表
assessment: 课堂练习正确率、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；搜索方法的区别、三元组、专家系统的组成是期末闭卷考试的常考内容
reflection: ''
