# 第 7 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 7
online: 4
offline: 0
methods:
- 讲授法（录播课件）
- 案例教学法（社区工作者小郑贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上自主学习
objectives:
  knowledge:
  - 说出频率、振幅、采样率、量化位数的含义，以及语音识别、语音合成、声纹识别、语音唤醒分别做什么
  - 解释波形和频谱的区别，说明为什么计算机通常要从频谱中提取语音的特征
  - 用自己的话说明语音识别和语音合成的大致流程，以及语音大模型与传统“识别、理解、合成”流水线的不同
  skill:
  - 手算一段录音的数据量和一次语音识别的字错率
  - 识别语音克隆诈骗的常见手法，说出防范办法和使用他人声音的法律要求
  - 分析一个语音应用在噪声、方言、多音字等情况下可能出现的问题，并提出改进办法
  quality:
  - 提高防范 AI 拟声诈骗的意识，能把防范办法讲给家里的老人听
  - 尊重他人的声音权益；关注适老化和无障碍，用语音技术帮助老年人和残障人士
key_points:
- 频率、振幅、采样率、量化位数
- 波形与频谱
- 语音识别、语音合成的流程，字错率
- 声纹识别与语音克隆，声音受法律保护
difficulties:
- point: 理解采样定理和频谱
  solution: 在“声音的模样”动画中先放一个纯音看频谱只有一根线，再放 a、i、u 三个元音对比频谱形状；把采样率调低，听声音怎样变闷
- point: 字错率怎样计算
  solution: 用“算一算：会议录音的字错率”逐字对齐原文和识别结果，分别数出替换、删除、插入的字；再让学生用自己的语音输入算一次
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 75
    content: 阅读网页教材第 7 章 7.1–7.6 节，完成正文中的 2 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 7-1
    minutes: 25
    content: 交互动画“声音的模样”：看不同声音的波形和频谱，调采样率和量化位数
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 把看不见的声音变成看得见的图
  - name: 在线体验 7-2
    minutes: 30
    content: 用语音输入和朗读功能做语音识别与合成，计算字错率，测试多音字和数字读法
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 体会语音技术的效果和难点
- phase: 线上导学（直播或录播）
  steps:
  - name: 难点导学
    minutes: 20
    content: 梳理预习中的共性问题；精讲两个难点（采样与频谱、字错率）；讲解语音克隆诈骗的防范和声音权益；完成 3 道课堂练习
    teacher: 直播讲解或发布录播课件，在讨论区集中回答预习中的共性问题
    student: 观看直播或录播，扫码完成课件中的 3 道课堂练习
    intent: 本章没有线下学时，用一次短的直播或录播把难点讲透，同时做一次防诈提醒
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 7-1、7-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用自己的话解释波形和频谱的区别，并说明为什么语音识别通常要从频谱中提取特征。
- 简答题：比较语音识别和语音合成：各自的输入和输出是什么？分别说出它们流程中的主要步骤，并各举两个身边的应用。
- 简答题：社区要给老年人做一次防范“AI 克隆声音诈骗”的宣传。请写出：（1）骗子常用的手法；（2）给老年人的三条防范建议；（3）年轻人自己可以做些什么来减少家人被骗的风险。
- 实操题：完成体验 7-1，提交记录表。回答：纯音的频率从 200 赫兹升高到 1000 赫兹，波形和频谱分别有什么变化？元音 a、i、u 的主要山峰分别在哪里？采样率要多高，还原出的折线才比较像原来的波？
- 实操题：完成体验 7-2，提交记录表和语音识别结果的截图。回答：安静和嘈杂环境下的字错率分别是多少？语音合成读错了哪些多音字或数字？你认为哪种音色最自然，为什么？
- 提交体验 7-1、体验 7-2 的记录表
assessment: 课后在线练习成绩、简答与实操作业、体验记录表计入平时成绩；采样率、字错率的计算，语音识别与合成的区别，语音克隆的防范是期末闭卷考试的常考内容
