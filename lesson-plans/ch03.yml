# 第 3 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 3
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法（奶茶店贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出机器学习的定义和基本流程，区分样本、特征、标签、模型这几个基本概念
  - 解释训练集和测试集为什么要分开，说明监督学习和无监督学习的区别并各举一个例子
  - 说明回归、分类、聚类分别解决什么问题，用自己的话描述线性回归、K 近邻、决策树和 K 均值的直观思路
  skill:
  - 手算简单的 K 近邻投票、K 均值分组，以及混淆矩阵上的准确率、精确率和召回率
  - 判断一个模型是欠拟合还是过拟合，分析“准确率很高”在什么情况下会误导人
  - 评价一个实际业务该更看重精确率还是召回率，并说明理由
  quality:
  - 养成“用数据说话、用没见过的数据检验”的科学态度，不轻信“准确率 99%”之类的单一数字
  - 认识到模型的错误有代价，判断精确率与召回率的取舍时能站在顾客、患者等受影响者的角度考虑
key_points:
- 样本、特征、标签、模型等基本概念，训练集与测试集的作用
- 监督学习与无监督学习的区别；回归、分类、聚类分别解决什么问题
- K 近邻、K 均值的直观思路与手算
- 准确率、精确率、召回率的计算与含义
difficulties:
- point: 理解过拟合：为什么训练误差越小，模型反而可能越差
  solution: 用“死记硬背与举一反三”类比引入；课堂上用“曲线拟合与过拟合”动画把复杂度从 1 拖到 9，让学生先凭直觉挑曲线、再看测试误差，亲眼看到测试误差先降后升
- point: 类别不平衡时准确率为什么会骗人，精确率和召回率怎样取舍
  solution: 先让学生猜“全判正常”的偷懒模型准确率（95%），制造反差；再用混淆矩阵“抓对、漏掉、冤枉、放对”四个中文名代替英文缩写，现场手算；最后拖动“阈值与混淆矩阵”动画，结合癌症筛查、垃圾短信等场景讨论哪种错误代价更大
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 60
    content: 阅读网页教材第 3 章 3.1–3.9 节，完成正文中的 5 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题：机器学习和写规则有什么不同？分类和聚类有什么不同？准确率高就一定好吗？
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文篇幅较长，放在线上按自己的节奏学，课堂时间留给难点
  - name: 在线体验 3-1
    minutes: 20
    content: 交互动画“K 近邻与 K 均值”：改变 K 值观察 K 近邻投票，逐步运行 K 均值
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 在操作中理解“看邻居投票”和“先分组、再挪中心”
  - name: 在线体验 3-2
    minutes: 25
    content: 交互动画“曲线拟合与过拟合”“阈值与混淆矩阵”：拖复杂度找最低测试误差，拖阈值读混淆矩阵
    teacher: 发布体验步骤和记录表，收集学生凭直觉选出的曲线次数
    student: 按步骤操作，填写记录表
    intent: 为课堂讨论过拟合和阈值准备第一手观察
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 奶茶店的三个新功能：明日备料建议、可疑差评提醒、会员分群，对应回归、分类、聚类；回顾预习问题和讨论区的疑问
    teacher: 讲述情景，展示预习问题的回答情况
    student: 回答“如果写规则，写得完吗”
    intent: 用贯穿全章的案例把三类任务串起来
  - name: 讲授
    minutes: 5
    content: 3.1–3.3：机器学习的定义与流程，样本、特征、标签、模型，训练集与测试集，三类学习方式对比
    teacher: 用奶茶店数据表逐一指认样本、特征、标签；用“练习题不能当考卷”说明测试集
    student: 在数据表上指出样本、特征、标签
    intent: 概念多但不难，用一张表快速梳理，为后面的算法打基础
  - name: 讲授与演示
    minutes: 8
    content: 3.4–3.5：线性回归“比一比三条直线”，K 近邻“这位新会员是不是常客”，决策树与专家系统的区别
    teacher: 讲解要点，结合例子和“算一算”演示；用“K 近邻与 K 均值”动画演示交界处的点对 K 敏感
    student: 现场算直线乙的平均误差、新会员到 C 的距离，回答 K = 5 时的结果
    intent: 通过手算把“训练”“预测”落到具体数字上
  - name: 讲授与演示
    minutes: 4
    content: 3.6：聚类与分类的区别，K 均值“给 6 位会员分两组”
    teacher: 板书 K 均值的三轮过程，切换动画到 K 均值模式逐步演示
    student: 跟着算两组中心
    intent: 看到起点选得差也能自己“走”到合适位置
  - name: 讲授与演示
    minutes: 7
    content: 3.7：欠拟合与过拟合，训练误差与测试误差，避免过拟合的四种办法
    teacher: 用“曲线拟合与过拟合”动画演示，对照学生课前凭直觉选的曲线次数
    student: 说出各复杂度属于欠拟合、刚好还是过拟合
    intent: 突破难点一：测试误差先降后升
  - name: 讲授与演示
    minutes: 8
    content: 3.8：准确率会骗人，混淆矩阵，精确率与召回率，阈值的取舍
    teacher: 先让学生猜偷懒模型的准确率，再一起算刷单模型的三个指标；拖动“阈值与混淆矩阵”动画，讨论四个场景
    student: 手算准确率、精确率、召回率，分组判断四个场景更看重哪个指标
    intent: 突破难点二：从“准确率高”到“看两种错误的代价”
  - name: 课堂练习
    minutes: 6
    content: 课件中的 3 道课堂练习（单选 8、单选 9、多选 5），其余在线题课后完成
    teacher: 组织学生扫码作答，讲评错误率高的选项
    student: 在线作答，查看解析
    intent: 即时检验重点和难点的掌握情况
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点；介绍《机器学习》中对应的章节；预告第 4 章深度学习
    teacher: 带领学生梳理知识导图，布置课后作业
    student: 复述本章要点
    intent: 形成知识结构，知道后续去哪里深入
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 3-1、3-2 记录表
    teacher: 批改作业和记录表，挑选优秀的“流失会员”方案在下次课分享
    student: 完成并提交作业
    intent: 把本章方法用到新的业务场景上
homework:
- 简答题：用“死记硬背”和“举一反三”的比喻，解释什么是欠拟合、什么是过拟合，并说明为什么训练模型时一定要留出测试集。
- 简答题：从“训练数据是否有标签”“类别是否事先确定”“结果怎样使用”三个方面比较分类和聚类，并各举一个生活中的例子。
- 简答题：某医院用一个模型从 10000 名体检者中筛查早期肺癌，其中实际患病的有 50 人。模型的混淆矩阵为：TP = 45，FN = 5，FP = 150，TN = 9800。请计算准确率、精确率和召回率，并评价这个模型能否用于初筛，阈值应往哪个方向调整。
- 实操题：打开交互动画“K 近邻与 K 均值”，在 K 近邻模式下完成以下操作并截图：（1）在每月到店 6.5 次、平均消费约 30 元的位置放一位新会员，记录 K = 1、3、5、7、9 时的预测结果；（2）切换到 K 均值模式，取 K = 2 运行到结束，记录用了几轮、两组各有多少人；再点三次“换一组起点”，每次都运行到结束，记录结果是否一样。最后用两三句话说明你观察到的规律。
- 实操题：奶茶店想提前知道哪些会员下个月可能不再光顾（流失），好及时发一张优惠券挽留。请为它设计一个机器学习方案，写明：（1）这是回归、分类还是聚类任务，属于哪类学习方式；（2）一个样本是什么，标签是什么；（3）至少列出 4 个你认为有用的特征；（4）数据怎样划分；（5）用什么指标评价，更看重精确率还是召回率，为什么。
- 提交体验 3-1、体验 3-2 的记录表
assessment: 课堂练习正确率、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；本章是期末闭卷考试的重点章，回归、分类、聚类的区别和精确率、召回率的计算是必考内容
