# 第 1 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 3
offline: 1
methods:
- 讲授法
- 案例教学法（快递调度员小周贯穿案例）
- 演示法（交互动画）
- 任务驱动法（算一算、在线体验）
- 线上线下混合教学
objectives:
  knowledge:
  - 说出人工智能的定义，复述图灵测试的过程，区分弱人工智能和强人工智能
  - 列出人工智能发展的三次浪潮和两次低谷，以及每个阶段的代表事件
  - 解释符号主义、连接主义、行为主义三大学派各自的基本思路，并说出本书哪几章分别属于哪个学派
  - 用自己的话解释数据、算法、算力三要素各起什么作用，并估算一次大模型训练需要多少算力
  skill:
  - 分析一款 AI 产品处在产业链的哪一层，用到了本书哪几章的技术
  - 规划自己在本专业的学习路径，说明后续各门专业课与目标岗位、证书的对应关系
  quality:
  - 客观看待人工智能：既不神化、也不恐惧，能用三次浪潮、两次低谷的历史解释“AI 热”
  - 从第一次使用起养成使用 AI 产品的三条底线：不输入敏感信息、重要信息要核查、如实说明 AI 的作用
key_points:
- 人工智能的定义、图灵测试，弱人工智能与强人工智能
- 人工智能发展的三次浪潮与两次低谷
- 符号主义、连接主义、行为主义三大学派
- 数据、算法、算力三要素，人工智能产业链的三层
difficulties:
- point: 区分三大学派，并把具体技术归到相应的学派
  solution: 只抓一个问题：“智能从哪里来”——规则推理、神经网络、与环境互动；用本书各章的技术做归类游戏（专家系统、大模型、AlphaGo），AlphaGo 作为“三派融合”的例子
- point: 理解算力的数量级，为什么大模型离不开算力
  solution: 课堂上带学生做“算一算：训练一个大模型要算多久”，把总计算量换算成一台电脑要算多少年、一万块 GPU 要算多少天，再联系“东数西算”
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 60
    content: 阅读网页教材第 1 章 1.1–1.6 节，完成正文中的 2 个“算一算”，观看课件
    teacher: 在学习平台发布预习任务单和 3 个预习问题
    student: 阅读教材，完成“算一算”，在讨论区提出疑问
    intent: 正文放在线上按自己的节奏学，集中时间留给难点和讨论
  - name: 在线体验 1-1
    minutes: 20
    content: 交互动画“图灵测试小游戏”：读对话判断是人还是 AI，玩两遍
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 亲身体会图灵测试“只看行为”的判断方式
  - name: 在线体验 1-2
    minutes: 25
    content: 国产大模型初体验：按附录 A 注册 3 款国产大模型，用同一组 5 个问题测试并填写对比表
    teacher: 发布体验步骤和记录表
    student: 按步骤操作，填写记录表
    intent: 第一次系统地使用 AI 产品，发现它的长处和错误
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 快递调度员小周：智能调度系统上线后，调度组从 12 人减到 5 人；回顾预习问题和讨论区的疑问
    teacher: 讲述情景，展示体验 1-2 对比表中有代表性的回答
    student: 说一说自己工作中遇到的 AI
    intent: 用身边的变化引出“人工智能是什么、能做什么”
  - name: 讲授
    minutes: 7
    content: 1.1：几种定义，图灵测试与 73% 的实验结果，中文屋，弱人工智能与强人工智能
    teacher: 结合体验 1-1 的正确率讲图灵测试，用中文屋引发讨论
    student: 回答“通过图灵测试就等于懂了吗”
    intent: 建立对“智能”的初步认识，区分弱、强人工智能
  - name: 讲授与演示
    minutes: 8
    content: 1.2：达特茅斯会议，三次浪潮与两次低谷，大模型时代
    teacher: 用交互动画“AI 发展时间线”逐段演示，对比“同一个问题，三个时代的答法”
    student: 说出每次浪潮靠的是什么方法、为什么进入低谷
    intent: 形成历史脉络，理解技术进步的起伏
  - name: 讲授
    minutes: 5
    content: 1.3：三大学派及其融合
    teacher: 用“智能从哪里来”串起三派，组织归类游戏
    student: 把专家系统、大模型、AlphaGo 等归到学派
    intent: 突破难点一
  - name: 讲授
    minutes: 6
    content: 1.4：数据、算法、算力三要素，“算一算：训练一个大模型要算多久”
    teacher: 用“做菜”比喻三要素，带学生现场估算
    student: 跟着计算，说出三要素缺一不可的理由
    intent: 突破难点二
  - name: 讲授
    minutes: 6
    content: 1.5–1.6：产业链三层，本书技术全景图与课程地图，国产大模型产品，AI 相关岗位与证书，三条底线
    teacher: 展示技术全景图和课程地图，点评体验 1-2 中出错的回答
    student: 把一款 AI 产品放进产业链的某一层
    intent: 知道全书和专业的“地图”，树立正确使用 AI 的意识
  - name: 课堂练习
    minutes: 6
    content: 课件中的 3 道课堂练习，其余在线题课后完成
    teacher: 组织学生扫码作答，讲评错误率高的选项
    student: 在线作答，查看解析
    intent: 即时检验重点掌握情况
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点；介绍附录 C 课程地图；预告第 2 章搜索与知识表示
    teacher: 带领学生梳理知识导图，布置课后作业
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 在线练习
    minutes: 15
    content: 完成本章 25 道在线作答题（单选、多选、判断）
    teacher: 查看平台统计，在讨论区讲解错误率最高的 3 道题
    student: 在线作答，错题点“回看”复习对应小节
    intent: 巩固基础知识
  - name: 简答与实操
    minutes: 15
    content: 完成 3 道简答题和 2 道实操题，提交体验 1-1、1-2 记录表
    teacher: 批改作业和记录表，挑选优秀作业在下次课或讨论区分享
    student: 完成并提交作业
    intent: 把本章方法用到自己的工作和生活场景中
homework:
- 简答题：用“做菜”的比喻说明人工智能三要素各起什么作用，并结合 2012 年深度学习的突破，说明为什么三要素缺一不可。
- 简答题：比较符号主义和连接主义：它们分别认为智能从哪里来？各有什么优点和局限？各举一个代表成果。
- 简答题：小周所在的快递公司上线了智能调度系统后，调度组从十二个人减到了五个人。请结合本章内容，分析哪些工作被 AI 替代了，哪些工作留给了人，又出现了哪些新工作，并说说这对你规划自己的学习有什么启发。
- 实操题：完成体验 1-1：玩两遍“图灵测试小游戏”，提交记录表的截图或照片，写出你两次的正确率，以及你认为最有用的两条判断依据。再用 100 字左右谈谈：如果一个 AI 在游戏里次次被判为人，你会认为它“有智能”吗？
- 实操题：完成体验 1-2：用同一组 5 个问题测试 3 款国产大模型，提交对比表和至少 3 张截图。要求写明：（1）问题 2 的正确答案和你的计算过程，有没有产品算错；（2）问题 4 的核查方法和结果，有没有产品编造了线路或日期；（3）你最推荐哪一款，理由是什么。
- 提交体验 1-1、体验 1-2 的记录表
assessment: 课堂练习正确率、在线练习成绩、简答与实操作业、体验记录表计入平时成绩；人工智能的定义、三次浪潮、三大学派、三要素是期末闭卷考试的基础题
reflection: ''
